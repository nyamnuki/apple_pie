<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 두 번 톡 눌러 확대되는 것은 CSS(touch-action: manipulation)로 막고,
         두 손가락 확대는 시력이 약한 사용자를 위해 허용한다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF5DF" />
    <!-- 홈 화면에 앱처럼 설치 (안드로이드: manifest, 아이폰: apple-touch-icon) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Math Town" />
    <title>Math Town</title>
    <!-- 탭 아이콘: 별도 파일 없이 SVG 로 넣는다 (나중에 public/assets/ui/ 그림으로 바꿔도 된다) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 글꼴: 제목은 부드러운 세리프(Fraunces·고운바탕), 본문은 둥근 고딕(Nunito·고운돋움). 굵기는 가변 글꼴로 조금 낮게 -->
    <!-- 글꼴을 기다리느라 첫 화면이 멈추지 않게 한다.
         media="print" 로 받아 두고 다 받으면 media='all' 로 바꿔서 쓴다 (그 동안은 기기 기본 글꼴로 먼저 보여 준다).
         한글 글꼴이 커서, 이렇게 하지 않으면 느린 인터넷에서 몇 초 동안 흰 화면만 보인다. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Nunito:wght@400..800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Nunito:wght@400..800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Nunito:wght@400..800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
